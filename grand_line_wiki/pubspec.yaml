name: grand_line_wiki
description: Wiki de One Piece que consome a One Piece API (api-onepiece.com).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  google_mlkit_translation: ^0.15.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  google_mlkit_language_id: 0.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
